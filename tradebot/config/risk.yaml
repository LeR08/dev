# Risk limits, enforced by the RiskManager in test AND live mode.
# Change at runtime with: risk set <broker>.<key> <value>   (changes are logged)
kraken:
  max_position_pct_full: 5.0
  max_position_pct_half: 2.5
  max_open_positions: 5
  max_exposure_pct: 60.0         # gross notional (longs + shorts) in % of equity
  max_leverage: 2.0              # hard cap; automatic leverage never exceeds it
  allow_short: true
  stop_loss_pct: 3.0
  daily_loss_limit_pct: 3.0
  max_drawdown_pct: 15.0
  max_orders_per_minute: 10
  live_capital_cap_eur: null     # no default: live mode is refused until set
ibkr:
  max_position_pct_full: 5.0
  max_position_pct_half: 2.5
  max_open_positions: 5
  max_exposure_pct: 60.0         # gross notional (longs + shorts) in % of equity
  max_leverage: 2.0              # hard cap; automatic leverage never exceeds it
  allow_short: true
  stop_loss_pct: 3.0
  daily_loss_limit_pct: 3.0
  max_drawdown_pct: 15.0
  max_orders_per_minute: 10
  live_capital_cap_eur: null
