[project]
name = "tradebot"
version = "0.1.0"
description = "Local trading bot for Kraken Pro (crypto spot) and Interactive Brokers (stocks/ETFs). Test mode by default."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "websockets>=12.0",
    "ib_async>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "textual>=0.80",
    "python-dotenv>=1.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
bot = "tradebot.ui.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tradebot"]

[tool.pytest.ini_options]
testpaths = ["tradebot/tests"]
asyncio_mode = "auto"
